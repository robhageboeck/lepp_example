version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=leppdb
      - DB_USER=postgres
      - DB_PASSWORD=password
    volumes:
      - ./src:/var/www/html
    networks:
      - lepp-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=leppdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lepp-network

volumes:
  postgres_data:

networks:
  lepp-network:
    driver: bridge
