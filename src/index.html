<!DOCTYPE html>
<html>
<head>
    <title>LEPP Example</title>
</head>
<body>
    <h1>LEPP Stack</h1>

    <button id="sendNumber">Send Random Number</button>

    <div id="result"></div>

    <script>
        function makeRequest(data) {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'query.php');
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onload = function() {
                document.getElementById('result').innerHTML = '<pre>' + xhr.responseText + '</pre>';
            };
            xhr.send(JSON.stringify(data));
        }

        document.getElementById('sendNumber').onclick = function() {
            const randomNumber = Math.floor(Math.random() * 1000) + 1;
            makeRequest({action: 'insert', number: randomNumber});
        };
    </script>
</body>
</html>
